name: Windows desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend and packaging tools
        working-directory: backend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --all-groups --locked
          uv pip install pyinstaller

      - name: Build desktop executable
        working-directory: backend
        shell: pwsh
        run: |
          uv run pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --noconsole `
            --name GeneLabLedger `
            --paths . `
            --hidden-import=uvicorn `
            --hidden-import=uvicorn.logging `
            --hidden-import=uvicorn.loops `
            --hidden-import=uvicorn.loops.auto `
            --hidden-import=uvicorn.protocols `
            --hidden-import=uvicorn.protocols.http `
            --hidden-import=uvicorn.protocols.http.auto `
            --hidden-import=uvicorn.protocols.websockets `
            --hidden-import=uvicorn.protocols.websockets.auto `
            --hidden-import=uvicorn.lifespan `
            --hidden-import=uvicorn.lifespan.on `
            --hidden-import=fastapi `
            --hidden-import=starlette `
            --hidden-import=pydantic `
            --hidden-import=pydantic_settings `
            --hidden-import=sqlalchemy `
            --hidden-import=alembic `
            --hidden-import=webview `
            --hidden-import=app `
            --hidden-import=app.main `
            --hidden-import=app.config `
            --collect-all uvicorn `
            --collect-all fastapi `
            --collect-all starlette `
            --collect-all pydantic `
            --add-data "..\frontend\dist;frontend\dist" `
            desktop\launcher.py
          New-Item -ItemType Directory -Force -Path ..\release | Out-Null
          Copy-Item -Path dist\GeneLabLedger.exe -Destination ..\release\GeneLabLedger-windows-x64.exe -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneLabLedger-windows-x64
          path: release/GeneLabLedger-windows-x64.exe
          if-no-files-found: error

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            release/GeneLabLedger-windows-x64.exe `
            --title "GeneLabLedger ${{ github.ref_name }}" `
            --generate-notes