name: Windows desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend and packaging tools
        working-directory: backend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --all-groups --locked
          uv pip install nuitka ordered-set zstandard

      - name: Build desktop executable with Nuitka
        working-directory: backend
        shell: pwsh
        run: |
          uv run python -m nuitka `
            --standalone `
            --windows-console-mode=force `
            --output-filename=GeneLabLedger.exe `
            --output-dir=dist `
            --assume-yes-for-downloads `
            --include-package=app `
            --include-package=uvicorn `
            --include-package=fastapi `
            --include-package=starlette `
            --include-package=pydantic `
            --include-package=pydantic_settings `
            --include-package=sqlalchemy `
            --include-package=alembic `
            --include-data-dir=../frontend/dist=frontend/dist `
            --nofollow-import-to=webview.platforms.android `
            --nofollow-import-to=webview.platforms.gtk `
            --nofollow-import-to=webview.platforms.cocoa `
            --nofollow-import-to=webview.platforms.qt `
            --nofollow-import-to=pytest `
            --nofollow-import-to=ruff `
            --nofollow-import-to=httpx `
            desktop/launcher.py

          New-Item -ItemType Directory -Force -Path ../release | Out-Null
          Compress-Archive -Path dist/launcher.dist/* -DestinationPath ../release/GeneLabLedger-windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneLabLedger-windows-x64
          path: release/GeneLabLedger-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            release/GeneLabLedger-windows-x64.zip `
            --title "GeneLabLedger ${{ github.ref_name }}" `
            --generate-notes