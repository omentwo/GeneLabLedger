name: Windows desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend and packaging tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv pyinstaller
          uv sync --project backend --dev --locked

      - name: Build desktop executable
        shell: pwsh
        run: |
          Set-Location backend
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name GeneLabLedger `
            --paths . `
            --add-data "..\frontend\dist;frontend\dist" `
            desktop\launcher.py
          New-Item -ItemType Directory -Force -Path ..\release | Out-Null
          Compress-Archive -Path dist\GeneLabLedger.exe -DestinationPath ..\release\GeneLabLedger-windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneLabLedger-windows-x64
          path: release/GeneLabLedger-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            release/GeneLabLedger-windows-x64.zip `
            --title "GeneLabLedger ${{ github.ref_name }}" `
            --generate-notes
