name: Windows Electron validation (PyInstaller backend)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-pyinstaller:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked backend dependencies
        working-directory: backend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --all-groups --locked

      - name: Build Python sidecar with PyInstaller
        working-directory: backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/backend-sidecar | Out-Null
          uv run pyinstaller `
            --clean `
            --noconfirm `
            --distpath dist/backend-sidecar `
            --workpath build/pyinstaller `
            GeneLabLedger.spec

      - name: Package Electron installer
        working-directory: frontend
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run desktop:package

      - name: Prepare named artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath release/electron -Filter *-Setup.exe | Select-Object -First 1
          if (-not $installer) { throw "Electron installer was not produced" }
          Copy-Item -LiteralPath $installer.FullName -Destination release/GeneLabLedger-pyinstaller-windows-x64-Setup.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneLabLedger-pyinstaller-windows-x64
          path: release/GeneLabLedger-pyinstaller-windows-x64-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release asset for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --title "GeneLabLedger ${{ github.ref_name }}" --generate-notes
          }
          gh release upload "${{ github.ref_name }}" release/GeneLabLedger-pyinstaller-windows-x64-Setup.exe --clobber
